<html>

<head>
    <meta charset="utf-8">
    <title>pi</title>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/brython@3.10.5/brython.min.js">
    </script>
    <script type="text/javascript"
        
src="https://cdn.jsdelivr.net/npm/brython@3.10.5/brython_stdlib.js">
    </script>
</head>

<body onload="brython()">

<script type="text/python">
import time
import math

from browser import document
import browser.timer

content = document["content"]

def calcPi():
    q, r, t, k, n, l = 1, 0, 1, 1, 3, 3
    while True:
        if 4*q+r-t < n*t:
            yield n
            nr = 10*(r-n*t)
            n  = ((10*(3*q+r))//t)-10*n
            q  *= 10
            r  = nr
        else:
            nr = (2*q+r)*l
            nn = (q*(7*k)+2+(r*l))//(t*l)
            q  *= k
            t  *= l
            l  += 2
            k += 1
            n  = nn
            r  = nr

def add_digit():
    global generator, counter, content
    counter+=1
    content <= next(generator)
    if counter == 1:
        content <= '.'
    if counter % 100 == 0:
        content <= ''

counter = 0
generator = calcPi()

browser.timer.set_interval(add_digit, 100)

</script>

<div id="content" style="overflow-wrap: break-word;font-family: monospace;"></div>

</body>

</html>
